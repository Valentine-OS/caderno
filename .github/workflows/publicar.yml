# Confere o feed.json, monta o site com o RSS e publica no GitHub Pages.
# Se a conferência falhar, nada é publicado e o site continua na versão anterior.
#
# Em ramos teste/... a ativação confere e monta, mas não publica: serve para testar mudanças.

name: Publicar

on:
  push:
    branches: [main, 'teste/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que está em andamento.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir o feed.json
        run: python3 tools/conferir.py feed.json

      - name: Juntar os escritos longos
        run: python3 tools/juntar_escritos.py feed.json escritos _site/feed.json

      - name: Conferir o feed com os escritos
        run: python3 tools/conferir.py _site/feed.json

      - name: Montar o site e gerar o RSS
        run: |
          cp index.html caderno.css caderno.js feed.exemplo.json .nojekyll _site/
          cp -r desenhos _site/
          python3 tools/gerar_rss.py _site/feed.json _site/feed.xml

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  publicar:
    needs: montar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
